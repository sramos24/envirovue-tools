<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a5c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<title>Insight Environmental — Photo Documentation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root {
  --navy:#1a3a5c; --blue:#2e6da4; --ice:#d9e2f3; --bg:#f0f3f8;
  --g1:#f8f9fb; --g2:#eef1f6; --g3:#dde3ee; --g4:#b0bcd0; --g5:#7a8ca0; --g6:#4a5568; --g7:#2d3748;
  --green:#2a7a4a; --amber:#c08a10; --red:#b83030; --teal:#1a7a6e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--g7);min-height:100vh;-webkit-font-smoothing:antialiased}
/* HEADER */
header{background:var(--navy);padding:0 20px;padding-top:max(0px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));min-height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.brand{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff;letter-spacing:.04em;flex:1;min-width:0;line-height:1.3}
.brand span{display:block;color:rgba(255,255,255,.5);font-weight:400;font-size:11px;margin-top:1px}
.hdr-btns{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:6px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.96);opacity:.85}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-white{background:#fff;color:var(--navy)}
.btn-white:hover{background:var(--ice)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#1f5c38}
.btn-amber{background:var(--amber);color:#fff}
.btn-amber:hover{background:#9a6e0a}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:#136058}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn-outline-light{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 7px;font-size:11px}
/* LAYOUT */
.container{max-width:1200px;margin:0 auto;padding:20px}
@media(max-width:600px){.container{padding:12px}}
/* PROP BAR */
.prop-bar{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.pf{flex:1;min-width:140px}
.pf label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g5);margin-bottom:4px}
.pf input{width:100%;padding:7px 10px;border:1px solid var(--g3);border-radius:6px;font-family:inherit;font-size:13px;color:var(--g7);background:#fff}
.pf input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(46,109,164,.15)}
/* LINK BANNER */
.link-banner{display:none;background:linear-gradient(135deg,#1a3a5c,#2e6da4);color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(26,58,92,.25)}
.link-banner.visible{display:flex}
.lb-icon{font-size:20px;flex-shrink:0}
.lb-text{flex:1;min-width:0}
.lb-title{font-weight:600;font-size:14px}
.lb-sub{font-size:12px;opacity:.75;margin-top:2px}
/* COMPRESS PANEL */
.compress-panel{display:none;background:#fff;border:1.5px solid var(--ice);border-radius:10px;padding:12px 16px;margin-bottom:14px;gap:10px;flex-wrap:wrap;align-items:center}
.compress-panel.visible{display:flex}
.compress-panel label{font-size:12px;font-weight:600;color:var(--g6)}
.compress-panel select{padding:5px 8px;border:1px solid var(--g3);border-radius:6px;font-size:12px;font-family:inherit}
/* TOOLBAR */
.toolbar{display:none;background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.toolbar.visible{display:flex}
.filter-tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.ftab{padding:5px 11px;border-radius:20px;border:1.5px solid var(--g3);background:#fff;font-size:12px;font-weight:600;color:var(--g5);cursor:pointer}
.ftab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.ftab:hover:not(.active){background:var(--g2)}
.toolbar-right{display:flex;gap:6px;align-items:center}
.stats-lbl{font-size:12px;color:var(--g5);white-space:nowrap}
/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--g3);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#fff;display:block}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--blue);background:rgba(46,109,164,.04)}
.upload-zone .uz-icon{font-size:40px;margin-bottom:12px;opacity:.5}
.upload-zone h3{font-size:16px;font-weight:600;color:var(--g6);margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--g4)}
/* PHOTO GRID */
.section-group{margin-bottom:20px}
.sec-heading{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g5);padding:6px 0 8px;border-bottom:1.5px solid var(--g3);margin-bottom:10px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
@media(max-width:500px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:8px}}
.photo-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:grab;position:relative;transition:box-shadow .15s}
.photo-card:active{cursor:grabbing}
.photo-card.drag-over{box-shadow:0 0 0 3px var(--blue)}
.photo-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photo-body{padding:8px 10px 10px}
.photo-seq{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:1px}
.photo-fname{font-size:10px;color:var(--g4);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-fields{display:flex;flex-direction:column;gap:5px}
.photo-fields select,.photo-fields textarea{width:100%;padding:5px 7px;border:1px solid var(--g3);border-radius:5px;font-family:inherit;font-size:12px;color:var(--g7);background:#fff}
.photo-fields select:focus,.photo-fields textarea:focus{outline:none;border-color:var(--blue)}
.photo-fields textarea{resize:vertical;min-height:44px}
.link-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 6px;background:#d4edda;color:#1a5c2e;border-radius:4px;margin-bottom:4px}
.photo-del{display:block;margin-top:6px;background:none;border:none;color:var(--g4);font-size:15px;cursor:pointer;padding:2px 4px;text-align:right;width:100%}
.photo-del:hover{color:var(--red)}
/* LIST VIEW */
.photo-list{display:flex;flex-direction:column;gap:8px}
.list-card{background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.list-thumb{width:80px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0}
.list-body{flex:1;min-width:0}
.list-top{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.list-fields{display:flex;gap:6px;flex-wrap:wrap}
.list-fields select{padding:4px 7px;border:1px solid var(--g3);border-radius:5px;font-family:inherit;font-size:12px}
.list-fields textarea{width:100%;padding:4px 7px;border:1px solid var(--g3);border-radius:5px;font-family:inherit;font-size:12px;resize:vertical;min-height:38px;margin-top:4px}
/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:740px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--g2);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:17px;font-weight:700;color:var(--navy);flex:1}
.modal-close{background:none;border:none;font-size:22px;color:var(--g4);cursor:pointer;padding:0 4px;line-height:1}
.modal-close:hover{color:var(--g6)}
.modal-body{padding:16px 20px 20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--g2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* PDF */
#pdfPreview{font-family:'IBM Plex Sans',sans-serif;color:#1a1a1a}
.pdf-cover{margin:0 auto 32px;max-width:680px}
.pdf-cover-hdr{background:#1a3a5c;color:#fff;padding:24px 28px;border-radius:8px 8px 0 0}
.pdf-cover-hdr h1{font-size:20px;font-weight:700;margin-bottom:4px}
.pdf-cover-hdr p{font-size:13px;opacity:.7}
.pdf-cover table{width:100%;border-collapse:collapse;border:1px solid #dde3ee}
.pdf-cover td{padding:9px 14px;font-size:13px;border-bottom:1px solid #eef1f6;vertical-align:top}
.pdf-cover td:first-child{background:#1a3a5c;color:#fff;font-weight:600;width:150px}
.pdf-section{max-width:680px;margin:0 auto 28px}
.pdf-sec-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1a3a5c;border-bottom:2px solid #1a3a5c;padding-bottom:6px;margin-bottom:14px}
.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pdf-card{border:1px solid #dde3ee;border-radius:6px;overflow:hidden;page-break-inside:avoid}
.pdf-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pdf-card-body{padding:8px 10px}
.pdf-card-num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:#1a3a5c}
.pdf-card-cat{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;background:#d9e2f3;color:#1a3a5c;margin:3px 0;text-transform:uppercase;letter-spacing:.04em}
.pdf-card-caption{font-size:12px;color:#4a5568;line-height:1.45;margin-top:3px}
@media print{
  header,.toolbar,.prop-bar,.upload-zone,.compress-panel,.link-banner,.modal-overlay,.hdr-btns,.compress-panel{display:none!important}
  body{background:#fff}
  .container{padding:0;max-width:none}
  #pdfPreview{display:block!important}
}
/* LOG */
#logText{width:100%;min-height:300px;border:1px solid var(--g3);border-radius:6px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.55;resize:vertical}
/* TOAST */
.toast{position:fixed;bottom:max(24px,calc(24px + env(safe-area-inset-bottom)));left:50%;transform:translateX(-50%) translateY(60px);background:var(--g7);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.3);opacity:0;transition:all .3s;z-index:400;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<header>
  <div class="brand">INSIGHT ENVIRONMENTAL<span>Photo Documentation Tool</span></div>
  <div class="hdr-btns">
    <button class="btn btn-teal btn-sm" id="hiImportBtn">&#128203; Load HI Session</button>
    <input type="file" id="hiImportInput" accept=".json" style="display:none">
    <button class="btn btn-ghost btn-sm" id="linkBtn">&#128279; Link Field Notes</button>
    <input type="file" id="mapInput" accept=".json" style="display:none">
    <button class="btn btn-amber btn-sm" id="saveBtn">&#128190; Save</button>
    <input type="file" id="restoreInput" accept=".json" style="display:none">
    <button class="btn btn-ghost btn-sm" id="restoreBtn">&#8617; Restore</button>
    <button class="btn btn-green btn-sm" id="pdfBtn">&#128196; Export PDF</button>
  </div>
</header>

<div class="container">

  <div class="prop-bar">
    <div class="pf" style="flex:2;min-width:200px">
      <label>Property Address</label>
      <input type="text" id="propAddress" placeholder="1642 Lauren Dr., Petaluma, CA">
    </div>
    <div class="pf">
      <label>Inspection Date</label>
      <input type="text" id="propDate" placeholder="May 8, 2026">
    </div>
    <div class="pf">
      <label>Inspector</label>
      <input type="text" id="propInspector" value="Steve Ramos">
    </div>
    <div style="display:flex;align-items:flex-end;gap:6px">
      <button class="btn btn-outline btn-sm" id="addBtn">+ Add Photos</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    </div>
  </div>

  <div class="link-banner" id="linkBanner">
    <div class="lb-icon">&#128279;</div>
    <div class="lb-text">
      <div class="lb-title" id="lbTitle">Field notes linked</div>
      <div class="lb-sub" id="lbSub"></div>
    </div>
    <button class="btn btn-outline-light btn-xs" id="unlinkBtn">Unlink</button>
  </div>

  <div class="compress-panel" id="compressPanel">
    <label>Max Width:</label>
    <select id="maxWSelect">
      <option value="1920">1920px</option>
      <option value="1280">1280px</option>
      <option value="960">960px</option>
    </select>
    <label>Quality:</label>
    <select id="qualitySelect">
      <option value="0.80">High 80%</option>
      <option value="0.65">Med 65%</option>
      <option value="0.50">Low 50%</option>
    </select>
    <label>Format:</label>
    <select id="formatSelect">
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
    </select>
    <button class="btn btn-white btn-sm" id="recompressBtn">Recompress All</button>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="toolbar-right">
      <span class="stats-lbl" id="statsLbl"></span>
      <select id="groupBy" style="padding:5px 8px;border:1px solid var(--g3);border-radius:6px;font-size:12px;font-family:inherit">
        <option value="section">Group: Section</option>
        <option value="category">Group: Category</option>
        <option value="none">No Grouping</option>
      </select>
      <button class="btn btn-outline btn-sm" id="viewToggle">&#9783; List</button>
      <button class="btn btn-danger btn-sm" id="clearBtn">Clear All</button>
    </div>
  </div>

  <div id="photosWrap"></div>
</div>

<!-- PDF Modal -->
<div class="modal-overlay" id="pdfModal">
  <div class="modal" style="max-width:800px">
    <div class="modal-head">
      <div class="modal-title">PDF Preview</div>
      <button class="modal-close" id="pdfClose">&#215;</button>
    </div>
    <div class="modal-body"><div id="pdfPreview"></div></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="logBtn" style="background:var(--g2);color:var(--g7)">&#128220; Export Log</button>
      <button class="btn btn-green" id="printBtn">&#128424; Print / Save PDF</button>
    </div>
  </div>
</div>

<!-- Log Modal -->
<div class="modal-overlay" id="logModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-head">
      <div class="modal-title">Photo Log</div>
      <button class="modal-close" id="logClose">&#215;</button>
    </div>
    <div class="modal-body"><textarea id="logText" readonly></textarea></div>
    <div class="modal-foot">
      <button class="btn btn-white" id="copyLogBtn" style="background:var(--navy);color:#fff">&#128203; Copy</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ────────────────────────────────────────────────
const SAVE_KEY = 'insight_photo_v2';
let photos = [], nextId = 1, photoMap = {}, linkedFile = '';
let viewMode = 'grid', activeFilter = 'All';

const SECTIONS   = ['General','Roofing','Exteriors','Electrical','HVAC','Plumbing','Interiors','Structural','—'];
const CATEGORIES = ['System Description','Repair','Due Diligence','Rec. Maintenance','Information','Monitor','Limitation','—'];

// ─── COMPRESS ─────────────────────────────────────────────
function getCompress() {
  return {
    maxW:    parseInt(document.getElementById('maxWSelect').value)    || 1920,
    quality: parseFloat(document.getElementById('qualitySelect').value) || 0.80,
    format:  document.getElementById('formatSelect').value             || 'jpeg'
  };
}
function compressImage(dataUrl) {
  const { maxW, quality, format } = getCompress();
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/' + format, quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function readFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('fail'));
    r.readAsDataURL(file);
  });
}

// ─── PHOTO MAP ────────────────────────────────────────────
const SMAP = { ROOFING:'Roofing', GENERAL:'General', EXTERIORS:'Exteriors', ELECTRICAL:'Electrical', HVAC:'HVAC', PLUMBING:'Plumbing', INTERIORS:'Interiors', STRUCTURAL:'Structural' };
function extractId(filename) {
  const m = (filename||'').match(/IMG[\s_-]*E?(\d+)/i);
  return m ? 'IMG_'+m[1] : (filename||'').replace(/\.[^.]+$/,'');
}
function lookupPhoto(filename) {
  if (!Object.keys(photoMap).length) return null;
  const id = extractId(filename);
  if (photoMap[id]) return photoMap[id];
  const m = (filename||'').match(/IMG[\s_-]*E?(\d+)/i);
  if (m) {
    for (const v of ['IMG_'+m[1],'IMG_E'+m[1]]) { if (photoMap[v]) return photoMap[v]; }
  }
  return null;
}
function rematchAll() {
  photos.forEach(p => {
    const match = lookupPhoto(p.filename);
    if (match) {
      p.section  = SMAP[match.section] || match.section_label || p.section;
      p.category = match.code_label    || p.category;
      p.caption  = match.finding_text  || p.caption;
      p.linked   = true;
    } else { p.linked = false; }
  });
  renderPhotos(); updateBadges(); autosave();
}
function updateLinkBanner() {
  const b = document.getElementById('linkBanner');
  if (!linkedFile) { b.classList.remove('visible'); return; }
  b.classList.add('visible');
  document.getElementById('lbTitle').textContent = 'Linked: ' + linkedFile;
  document.getElementById('lbSub').textContent   = photos.filter(p=>p.linked).length + ' of ' + photos.length + ' photos matched';
}
function unlinkMap() {
  photoMap={}; linkedFile=''; photos.forEach(p=>p.linked=false);
  updateLinkBanner(); renderPhotos(); autosave(); toast('Unlinked');
}

// ─── FILTER / TOOLBAR ─────────────────────────────────────
function buildFilterTabs() {
  const secs = ['All',...new Set(photos.map(p=>p.section).filter(s=>s&&s!=='—'))];
  const wrap = document.getElementById('filterTabs');
  wrap.innerHTML = secs.map(s=>`<button class="ftab${s===activeFilter?' active':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
  wrap.querySelectorAll('.ftab').forEach(b => b.addEventListener('click',()=>{ activeFilter=b.dataset.s; buildFilterTabs(); renderPhotos(); }));
}
function updateBadges() { buildFilterTabs(); updateStats(); updateLinkBanner(); }
function updateStats() {
  const linked = photos.filter(p=>p.linked).length;
  let t = photos.length + ' photo' + (photos.length!==1?'s':'');
  if (linked) t += ' · ' + linked + ' linked';
  document.getElementById('statsLbl').textContent = t;
}
function showToolbar() { document.getElementById('toolbar').classList.add('visible'); }

// ─── FILE UPLOAD ──────────────────────────────────────────
async function handleFiles(files) {
  const arr = Array.from(files).filter(f=>f.type.startsWith('image/'));
  if (!arr.length) return;
  toast('Processing ' + arr.length + ' photo' + (arr.length!==1?'s':'') + '...');
  for (const file of arr) {
    const raw = await readFile(file);
    const src = await compressImage(raw);
    const match = lookupPhoto(file.name);
    photos.push({
      id:       nextId++, src, filename: file.name,
      section:  match ? (SMAP[match.section]||match.section_label||'—') : '—',
      category: match ? (match.code_label||'—') : '—',
      caption:  match ? (match.finding_text||'') : '',
      linked:   !!match, order: photos.length
    });
  }
  document.getElementById('compressPanel').classList.add('visible');
  showToolbar(); renderPhotos(); updateBadges(); autosave();
  toast(arr.length + ' photo' + (arr.length!==1?'s':'') + ' added');
}

// ─── RENDER ───────────────────────────────────────────────
function visible() { return activeFilter==='All' ? [...photos] : photos.filter(p=>p.section===activeFilter); }
function renderPhotos() {
  const wrap = document.getElementById('photosWrap');
  const vis = visible();
  if (!vis.length) {
    if (!photos.length) { wrap.innerHTML = uploadZoneHTML(); wireUploadZone(); }
    else wrap.innerHTML = `<div style="text-align:center;padding:40px;color:var(--g4)"><div style="font-size:32px;margin-bottom:10px">&#128269;</div><p>No photos in <strong>${esc(activeFilter)}</strong></p></div>`;
    return;
  }
  const gb = document.getElementById('groupBy').value;
  if (gb === 'none') {
    wrap.innerHTML = viewMode==='grid'
      ? `<div class="photo-grid">${vis.map(p=>makeCard(p, photos.indexOf(p)+1)).join('')}</div>`
      : `<div class="photo-list">${vis.map(p=>makeListCard(p, photos.indexOf(p)+1)).join('')}</div>`;
  } else {
    const key = gb==='category' ? 'category' : 'section';
    const groups = {};
    vis.forEach(p=>{ const g=p[key]||'—'; (groups[g]=groups[g]||[]).push(p); });
    wrap.innerHTML = Object.entries(groups).map(([g,items])=>{
      const cards = items.map(p=>viewMode==='grid'?makeCard(p,photos.indexOf(p)+1):makeListCard(p,photos.indexOf(p)+1)).join('');
      return `<div class="section-group"><div class="sec-heading">${esc(g)} <span style="font-weight:400;opacity:.6">(${items.length})</span></div>${viewMode==='grid'?`<div class="photo-grid">${cards}</div>`:`<div class="photo-list">${cards}</div>`}</div>`;
    }).join('');
  }
  wireCards(); wireDrag();
}
function uploadZoneHTML() {
  return `<label class="upload-zone" id="uploadZone">
    <div class="uz-icon">&#128247;</div>
    <h3>Drop Photos Here</h3>
    <p>Drag and drop, or tap to select photos from your library</p>
    <input type="file" id="fileInputZone" accept="image/*" multiple style="display:none">
  </label>`;
}
function sOpts(cur) { return SECTIONS.map(s=>`<option${s===cur?' selected':''}>${esc(s)}</option>`).join(''); }
function cOpts(cur) { return CATEGORIES.map(c=>`<option${c===cur?' selected':''}>${esc(c)}</option>`).join(''); }
function makeCard(p, seq) {
  return `<div class="photo-card" data-id="${p.id}" draggable="true">
    <img class="photo-thumb" src="${p.src}" alt="">
    <div class="photo-body">
      <div class="photo-seq"><strong>Photo ${seq}</strong></div>
      <div class="photo-fname">${esc(p.filename)}</div>
      ${p.linked?'<div class="link-chip">&#128279; LINKED</div>':''}
      <div class="photo-fields">
        <select data-f="section" data-id="${p.id}">${sOpts(p.section)}</select>
        <select data-f="category" data-id="${p.id}">${cOpts(p.category)}</select>
        <textarea data-f="caption" data-id="${p.id}" placeholder="Caption / finding description...">${esc(p.caption)}</textarea>
      </div>
      <button class="photo-del" data-del="${p.id}">&#128465; Remove</button>
    </div>
  </div>`;
}
function makeListCard(p, seq) {
  return `<div class="list-card" data-id="${p.id}" draggable="true">
    <img class="list-thumb" src="${p.src}" alt="">
    <div class="list-body">
      <div class="list-top">
        <span class="photo-seq"><strong>Photo ${seq}</strong></span>
        <span style="font-size:11px;color:var(--g4)">${esc(p.filename)}</span>
        ${p.linked?'<span class="link-chip">&#128279; LINKED</span>':''}
      </div>
      <div class="list-fields">
        <select data-f="section" data-id="${p.id}">${sOpts(p.section)}</select>
        <select data-f="category" data-id="${p.id}">${cOpts(p.category)}</select>
        <textarea data-f="caption" data-id="${p.id}" placeholder="Caption...">${esc(p.caption)}</textarea>
      </div>
    </div>
    <button class="photo-del" data-del="${p.id}">&#128465;</button>
  </div>`;
}
function wireCards() {
  document.querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener('change', e => upd(e.target.dataset.id, e.target.dataset.f, e.target.value));
    el.addEventListener('input',  e => upd(e.target.dataset.id, e.target.dataset.f, e.target.value));
  });
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ()=>removePhoto(b.dataset.del)));
}
function upd(id, field, value) {
  const p = photos.find(x=>x.id==id); if(p){ p[field]=value; autosave(); }
  if(field==='section') buildFilterTabs();
}
function removePhoto(id) { photos=photos.filter(p=>p.id!=id); renderPhotos(); updateBadges(); autosave(); }
function clearAll() {
  if(!confirm('Remove all photos?')) return;
  photos=[]; photoMap={}; linkedFile=''; activeFilter='All'; viewMode='grid';
  document.getElementById('toolbar').classList.remove('visible');
  document.getElementById('compressPanel').classList.remove('visible');
  document.getElementById('linkBanner').classList.remove('visible');
  renderPhotos(); autosave(); toast('Cleared');
}

// ─── DRAG REORDER ─────────────────────────────────────────
let dragId = null;
function wireDrag() {
  document.querySelectorAll('[data-id][draggable]').forEach(card => {
    card.addEventListener('dragstart', ()=>{ dragId=parseInt(card.dataset.id); card.style.opacity='.4'; });
    card.addEventListener('dragend',   ()=>{ dragId=null; card.style.opacity=''; });
    card.addEventListener('dragover',  e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      const tid=parseInt(card.dataset.id);
      if(dragId===null||dragId===tid) return;
      const fi=photos.findIndex(p=>p.id===dragId), ti=photos.findIndex(p=>p.id===tid);
      if(fi===-1||ti===-1) return;
      const [m]=photos.splice(fi,1); photos.splice(ti,0,m);
      photos.forEach((p,i)=>p.order=i);
      renderPhotos(); autosave();
    });
  });
}

// ─── UPLOAD ZONE DRAG ─────────────────────────────────────
function wireUploadZone() {
  const uz=document.getElementById('uploadZone'); if(!uz) return;
  uz.addEventListener('dragover', e=>{ e.preventDefault(); uz.classList.add('drag-over'); });
  uz.addEventListener('dragleave',()=>uz.classList.remove('drag-over'));
  uz.addEventListener('drop', e=>{ e.preventDefault(); uz.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
  const fiz=document.getElementById('fileInputZone');
  if(fiz) fiz.addEventListener('change', e=>handleFiles(e.target.files));
}

// ─── AUTOSAVE ─────────────────────────────────────────────
function autosave() {
  try {
    const d={version:2,address:document.getElementById('propAddress').value,date:document.getElementById('propDate').value,inspector:document.getElementById('propInspector').value,photos,photoMap,linkedFile,nextId,viewMode};
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));
  } catch(e){}
}
function loadAutosave() {
  try {
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d=JSON.parse(raw); if(!d||!d.photos) return;
    photos=d.photos||[]; photoMap=d.photoMap||{}; linkedFile=d.linkedFile||'';
    nextId=d.nextId||(photos.length?Math.max(...photos.map(p=>p.id))+1:1);
    viewMode=d.viewMode||'grid';
    if(d.address)   document.getElementById('propAddress').value=d.address;
    if(d.date)      document.getElementById('propDate').value=d.date;
    if(d.inspector) document.getElementById('propInspector').value=d.inspector;
    if(photos.length){ showToolbar(); document.getElementById('compressPanel').classList.add('visible'); renderPhotos(); updateBadges(); }
    updateLinkBanner();
  } catch(e){}
}
function saveSession() {
  const addr=(document.getElementById('propAddress').value||'session').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  const d={version:2,address:document.getElementById('propAddress').value,date:document.getElementById('propDate').value,inspector:document.getElementById('propInspector').value,photos,photoMap,linkedFile,nextId};
  const blob=new Blob([JSON.stringify(d)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=addr+'_photos.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Session saved');
}
function restoreSession(file) {
  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const d=JSON.parse(reader.result);
      photos=d.photos||[]; photoMap=d.photoMap||{}; linkedFile=d.linkedFile||'';
      nextId=d.nextId||(photos.length?Math.max(...photos.map(p=>p.id))+1:1);
      viewMode=d.viewMode||'grid';
      if(d.address)   document.getElementById('propAddress').value=d.address;
      if(d.date)      document.getElementById('propDate').value=d.date;
      if(d.inspector) document.getElementById('propInspector').value=d.inspector;
      if(photos.length){ showToolbar(); document.getElementById('compressPanel').classList.add('visible'); }
      renderPhotos(); updateBadges(); updateLinkBanner(); autosave();
      toast('Restored · '+photos.length+' photos');
    } catch(e){ toast('Could not read file'); }
  };
  reader.readAsText(file);
}

// ─── HI SESSION IMPORT ────────────────────────────────────
function importHISession(file) {
  toast('Reading session file...');
  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const bundle=JSON.parse(reader.result);
      if(bundle.version!==3||!bundle.state||!bundle.photoStore){ toast('Not a valid v3 Home Inspector session'); return; }
      const {state:hi,photoStore}=bundle;
      const SM={GENERAL:'General',ROOFING:'Roofing',EXTERIORS:'Exteriors',ELECTRICAL:'Electrical',HVAC:'HVAC',PLUMBING:'Plumbing',INTERIORS:'Interiors',STRUCTURAL:'Structural'};
      const CM={SD:'System Description',R:'Repair',DD:'Due Diligence',RM:'Rec. Maintenance',I:'Information',M:'Monitor',LM:'Limitation'};
      const ORD=['R','DD','RM','I','M'];
      if(hi.general){
        if(hi.general.address&&!document.getElementById('propAddress').value) document.getElementById('propAddress').value=hi.general.address;
        if(hi.general.date&&!document.getElementById('propDate').value){
          const d=new Date(hi.general.date+'T12:00:00');
          document.getElementById('propDate').value=d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
        }
      }
      let imported=0;
      for(const [sec,sd] of Object.entries(hi.sections||{})){
        const section=SM[sec]||sec;
        const sortedObs=[...(sd.observations||[])].sort((a,b)=>ORD.indexOf(a.code)-ORD.indexOf(b.code));
        const findings=[...(sd.descriptions||[]),...sortedObs,...(sd.limitations||[])];
        for(const f of findings){
          for(const ap of (f.attachedPhotos||[])){
            const stored=photoStore[ap.id];
            if(!stored?.src) continue;
            photos.push({id:nextId++,src:stored.src,filename:ap.filename||ap.id,section,category:CM[f.code]||'—',caption:(f.text||'').trim(),linked:false,order:photos.length});
            imported++;
          }
        }
      }
      if(!imported){ toast('No attached photos in this session'); return; }
      showToolbar(); renderPhotos(); updateBadges();
      document.getElementById('compressPanel').classList.add('visible');
      autosave();
      toast('Imported '+imported+' photo'+(imported!==1?'s':'')+' from Home Inspector');
    } catch(err){ console.error(err); toast('Could not read session file'); }
  };
  reader.readAsText(file);
}

// ─── PDF ──────────────────────────────────────────────────
function exportPDF() {
  if(!photos.length){ toast('No photos to export'); return; }
  const addr=document.getElementById('propAddress').value||'—';
  const date=document.getElementById('propDate').value||'—';
  const insp=document.getElementById('propInspector').value||'Steve Ramos';
  const gb=document.getElementById('groupBy').value;
  let html=`<div class="pdf-cover">
    <div class="pdf-cover-hdr"><h1>Home Inspection Report</h1><p>Photo Documentation</p></div>
    <table>
      <tr><td>Property</td><td>${esc(addr)}</td></tr>
      <tr><td>Date</td><td>${esc(date)}</td></tr>
      <tr><td>Inspector</td><td>${esc(insp)}</td></tr>
      <tr><td>Firm</td><td>Insight Environmental Building Consultants LLC</td></tr>
      <tr><td>License</td><td>CAC-17-6062 &nbsp;|&nbsp; CMC #1411011</td></tr>
      <tr><td>Total Photos</td><td>${photos.length}</td></tr>
    </table></div>`;
  const key=gb==='category'?'category':gb==='none'?null:'section';
  if(!key){
    html+=`<div class="pdf-section"><div class="pdf-sec-title">All Photos</div><div class="pdf-grid">${photos.map((p,i)=>pCard(p,i+1)).join('')}</div></div>`;
  } else {
    const groups={};
    photos.forEach((p,i)=>{ const g=p[key]||'—'; (groups[g]=groups[g]||[]).push({p,i}); });
    html+=Object.entries(groups).map(([g,items])=>
      `<div class="pdf-section"><div class="pdf-sec-title">${esc(g)}</div><div class="pdf-grid">${items.map(({p,i})=>pCard(p,i+1)).join('')}</div></div>`
    ).join('');
  }
  document.getElementById('pdfPreview').innerHTML=html;
  document.getElementById('pdfModal').classList.add('open');
}
function pCard(p,seq){
  return `<div class="pdf-card">
    <img src="${p.src}" alt="">
    <div class="pdf-card-body">
      <div class="pdf-card-num"><strong>Photo ${seq}</strong></div>
      ${p.section&&p.section!=='—'?`<div class="pdf-card-cat">${esc(p.section)}</div>`:''}
      ${p.category&&p.category!=='—'?`<div style="font-size:11px;color:#7a8ca0;margin-bottom:3px">${esc(p.category)}</div>`:''}
      ${p.caption?`<div class="pdf-card-caption">${esc(p.caption)}</div>`:''}
    </div></div>`;
}
function exportLog(){
  const addr=document.getElementById('propAddress').value||'—';
  const date=document.getElementById('propDate').value||'—';
  let out=`PHOTO LOG\nProperty: ${addr}\nDate: ${date}\nInspector: ${document.getElementById('propInspector').value||'Steve Ramos'}\n\n`;
  photos.forEach((p,i)=>{
    out+=`Photo ${i+1} — ${p.filename}\n  Section:  ${p.section||'—'}\n  Category: ${p.category||'—'}\n`;
    if(p.caption) out+=`  Caption:  ${p.caption}\n`;
    if(p.linked)  out+=`  [Linked]\n`;
    out+='\n';
  });
  document.getElementById('logText').value=out;
  document.getElementById('logModal').classList.add('open');
}

// ─── UTIL ─────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── INIT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  loadAutosave();
  wireUploadZone();

  // File inputs
  document.getElementById('fileInput').addEventListener('change', e=>{ handleFiles(e.target.files); e.target.value=''; });
  document.getElementById('addBtn').addEventListener('click', ()=>document.getElementById('fileInput').click());

  // Link field notes
  document.getElementById('linkBtn').addEventListener('click', ()=>document.getElementById('mapInput').click());
  document.getElementById('mapInput').addEventListener('change', e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try {
        const d=JSON.parse(reader.result);
        if(d.photo_map){ photoMap=d.photo_map; linkedFile=file.name; rematchAll(); updateLinkBanner(); autosave(); toast('Linked · '+Object.keys(photoMap).length+' entries'); }
        else toast('Invalid photo map');
      } catch(e){ toast('Could not read file'); }
    };
    reader.readAsText(file); e.target.value='';
  });
  document.getElementById('unlinkBtn').addEventListener('click', unlinkMap);

  // HI import
  document.getElementById('hiImportBtn').addEventListener('click', ()=>document.getElementById('hiImportInput').click());
  document.getElementById('hiImportInput').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) importHISession(f); e.target.value=''; });

  // Save/Restore
  document.getElementById('saveBtn').addEventListener('click', saveSession);
  document.getElementById('restoreBtn').addEventListener('click', ()=>document.getElementById('restoreInput').click());
  document.getElementById('restoreInput').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) restoreSession(f); e.target.value=''; });

  // PDF
  document.getElementById('pdfBtn').addEventListener('click', exportPDF);
  document.getElementById('pdfClose').addEventListener('click', ()=>document.getElementById('pdfModal').classList.remove('open'));
  document.getElementById('printBtn').addEventListener('click', ()=>{ document.getElementById('pdfModal').classList.remove('open'); setTimeout(()=>window.print(),300); });
  document.getElementById('logBtn').addEventListener('click', ()=>{ document.getElementById('pdfModal').classList.remove('open'); exportLog(); });

  // Log
  document.getElementById('logClose').addEventListener('click', ()=>document.getElementById('logModal').classList.remove('open'));
  document.getElementById('copyLogBtn').addEventListener('click', async ()=>{
    const txt=document.getElementById('logText').value;
    try{ await navigator.clipboard.writeText(txt); toast('Copied'); }
    catch{ document.getElementById('logText').select(); document.execCommand('copy'); toast('Copied'); }
  });

  // Toolbar
  document.getElementById('groupBy').addEventListener('change', ()=>{ renderPhotos(); autosave(); });
  document.getElementById('viewToggle').addEventListener('click', ()=>{
    viewMode=viewMode==='grid'?'list':'grid';
    document.getElementById('viewToggle').textContent=viewMode==='grid'?'&#9783; List':'&#9783; Grid';
    renderPhotos();
  });
  document.getElementById('clearBtn').addEventListener('click', clearAll);

  // Recompress
  document.getElementById('recompressBtn').addEventListener('click', async ()=>{
    if(!photos.length) return;
    toast('Recompressing...');
    for(const p of photos) p.src=await compressImage(p.src);
    renderPhotos(); autosave(); toast('Done');
  });

  // Prop bar autosave
  ['propAddress','propDate','propInspector'].forEach(id=>document.getElementById(id).addEventListener('input',autosave));

  // Modal backdrop
  document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); }));
});
</script>
</body>
</html>
